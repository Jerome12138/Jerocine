// danmaku.proto —— B站弹幕 seg.so 响应结构（字段定义源自 bilibili-API-collect 文档）。
// 仅保留弹幕需要的最小字段，tag 与原结构一致，保证 wire 兼容。
syntax = "proto3";

package danmu;

option go_package = "server/internal/danmu/proto;danmupb";

// DmSegMobileReply GET /x/v2/dm/web/seg.so 的响应体（含弹幕主体与弹幕池 tag）。
message DmSegMobileReply {
  repeated DanmakuElem elems = 1;
  repeated string tags = 2;
}

// DanmakuElem 单条弹幕。字段 tag 与官方一致（1~13），解析以 tag 驱动，字段漂移不拖垮整条。
message DanmakuElem {
  int64 id = 1;        // 弹幕 ID
  int32 progress = 2;  // 出现时间（毫秒，相对视频起点）
  int32 mode = 3;      // 弹幕模式：1 滚动 / 4 底部 / 5 顶部
  int32 fontsize = 4;  // 字号（基准字号 25）
  uint32 color = 5;    // 颜色（RGB888）
  string midHash = 6;  // 用户 hash（脱敏标识）
  string content = 7;  // 弹幕内容
  int64 ctime = 8;     // 发送时间（Unix 秒）
  int32 weight = 9;    // 权重（0~10，越高越难被过滤）
  string action = 10;  // 操作类型（正则弹幕标记）
  int32 pool = 11;     // 弹幕池：0 普通 / 1 字幕 / 2 特殊
  string idStr = 12;   // 弹幕 ID 字符串
  int32 attr = 13;     // 附加属性位
}
