openapi: 3.1.0

# ============================================================================
# Jerocine 唯一 API 契约真相 (CONTRACT OF RECORD)
# ----------------------------------------------------------------------------
# 本文件是前后端唯一契约源, 受 CI lint gate 约束 (spectral / redocly lint)。
# 后端手写 handler, 前端手写强类型 client; 任何端点变更必须先改本文件并过评审。
#
# 锁定原则 (终态架构):
#  - 全部 /api/v1 前缀, 参数统一 camelCase, 删旧站大写/link=/search= 兼容。
#  - HTTP 状态码语义化 (废除恒 200): 2xx 成功 / 4xx 客户端 / 5xx 服务端。
#  - 成功直接返回 data (不再 {code,data,msg} 三段); 失败统一 RFC7807。
#  - 每响应带 X-Trace-Id; 公开读接口带 ETag + Cache-Control 边缘缓存语义。
#  - 分页请求 ?page=&size=; 响应统一 {list, page:{current,size,total,pageCount}}。
# ============================================================================

info:
  title: Jerocine API
  version: 1.0.0
  description: |
    Jerocine 影视聚合站 API。终态架构: handler→service→repository(+cache)→db,
    MySQL 唯一权威真相, Redis 纯旁路缓存可回源。
    本契约覆盖公开内容、认证/用户、管理后台、采集、埋点、健康检查全部端点。
  contact:
    name: Jerocine
    email: recur-group@pipeline.sbcc.edu

servers:
  - url: /api/v1
    description: 经 nginx 反代 (rewrite 去 /api 前缀至后端)

tags:
  - name: content
    description: 公开内容 (GET 全部可边缘缓存)
  - name: auth
    description: 认证 (no-store)
  - name: me
    description: 当前用户 (no-store)
  - name: manage-config
    description: 管理后台-站点配置
  - name: manage-user
    description: 管理后台-用户管理
  - name: manage-collect
    description: 管理后台-采集源
  - name: manage-cron
    description: 管理后台-定时任务
  - name: manage-spider
    description: 管理后台-采集任务
  - name: manage-film
    description: 管理后台-影片/分类
  - name: manage-file
    description: 管理后台-文件库
  - name: manage-version
    description: 管理后台-APK 版本
  - name: manage-telemetry
    description: 管理后台-埋点监控
  - name: telemetry
    description: 埋点上报 (公开高频, 独立通道)
  - name: m3u8
    description: m3u8 代理过滤
  - name: health
    description: 健康检查 (无前缀, 无鉴权)

# ============================================================================
# 安全方案
# ============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT。登录返回 token, 客户端置于 Authorization: Bearer <token>。
        服务端临期自动续期, 通过响应头 `New-Token` 下发新 token。
        多设备 token (ZSET, 最多 5 设备) 由 v1:token:{userId} 管理。

  # ---------------- 通用参数 ----------------
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码 (从 1 开始)
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      required: false
      description: |
        每页条数。默认值集中在 config.PageSizeDefaults:
        home=14 / classify=21 / filter=49 / search=10 / gallery=39。
      schema: { type: integer, minimum: 1, maximum: 100 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 条件请求 ETag, 命中返回 304。
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      description: 资源主键
      schema: { type: integer, format: int64, minimum: 1 }

  # ---------------- 通用响应头 ----------------
  headers:
    XTraceId:
      description: 请求链路追踪 ID, 每个响应必带。
      schema: { type: string }
    ETag:
      description: 公开读接口资源指纹, 配合 If-None-Match 走 304。
      schema: { type: string }
    CacheControl:
      description: 公开读 `public, s-maxage=300, stale-while-revalidate=600`; 私有 `no-store`。
      schema: { type: string }
    NewToken:
      description: JWT 临期续签下发的新 token (鉴权接口可能出现)。
      schema: { type: string }
    RetryAfter:
      description: 限流时建议重试间隔 (秒)。
      schema: { type: integer }

  # ---------------- 通用响应 ----------------
  responses:
    NotModified:
      description: 资源未变更 (If-None-Match 命中)。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
    BadRequest:
      description: 参数错误。
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: "BAD_REQUEST", message: "参数 mid 非法", traceId: "a1b2c3" }
    Unauthorized:
      description: 未认证 / token 失效。
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: "UNAUTHORIZED", message: "登录已过期, 请重新登录", traceId: "a1b2c3" }
    Forbidden:
      description: 越权 (非管理员访问管理接口)。
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: "FORBIDDEN", message: "权限不足, 仅管理员可操作", traceId: "a1b2c3" }
    NotFound:
      description: 资源不存在。
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: "NOT_FOUND", message: "影片不存在", traceId: "a1b2c3" }
    Conflict:
      description: 冲突 (唯一约束 / 状态机非法跃迁)。
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: 语义校验失败 (字段格式 / 业务规则)。
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  details:
                    type: array
                    items: { $ref: '#/components/schemas/FieldError' }
    TooManyRequests:
      description: 限流 (m3u8 / login / telemetry 令牌桶)。
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: "RATE_LIMITED", message: "请求过于频繁", traceId: "a1b2c3" }
    ServerError:
      description: 服务端错误。
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: "INTERNAL", message: "服务器繁忙, 请稍后再试", traceId: "a1b2c3" }

  # ============================================================================
  # 数据模型 (DTO) — camelCase, 与 internal/dto 强一致
  # ============================================================================
  schemas:

    # ---------------- 错误模型 (RFC7807 风格) ----------------
    Problem:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          description: 机器可读错误码 (UPPER_SNAKE)。
          examples: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, RATE_LIMITED, INTERNAL]
        message: { type: string, description: 人类可读错误消息 (前端可直接 toast)。 }
        traceId: { type: string, description: 与 X-Trace-Id 一致的链路 ID。 }
        details:
          type: array
          description: 可选字段级错误 (422 时出现)。
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    # ---------------- 分页 ----------------
    PageMeta:
      type: object
      required: [current, size, total, pageCount]
      properties:
        current: { type: integer, description: 当前页码 }
        size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }
        pageCount: { type: integer, description: 总页数 }

    # ---------------- 内容: 分类 ----------------
    Category:
      type: object
      required: [id, pid, name, show, sort]
      properties:
        id: { type: integer, format: int64 }
        pid: { type: integer, format: int64, description: 父分类 ID, 0 为顶级 }
        name: { type: string }
        show: { type: boolean, description: 是否在导航显示 }
        sort: { type: integer, default: 0 }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    # ---------------- 内容: 卡片 / 列表项 (物化宽表投影) ----------------
    FilmCard:
      type: object
      description: |
        列表/卡片统一投影, 来源 movie_search 宽表单次查询 (cover 已进宽表, 零回填)。
        统一字段名, 删旧站 id|mid / score|rating|dbScore / 多处 cName 兼容债。
      required: [mid, name, cover]
      properties:
        mid: { type: integer, format: int64, description: 全局唯一业务主键 }
        cid: { type: integer, format: int64 }
        pid: { type: integer, format: int64 }
        name: { type: string }
        subTitle: { type: string }
        cName: { type: string, description: 分类名 }
        classTag: { type: string }
        area: { type: string }
        language: { type: string }
        year: { type: integer }
        state: { type: string, description: 正片|预告... }
        remarks: { type: string, description: 完结|更新至x集 }
        dbScore: { type: number, format: float, description: 豆瓣评分 0-10 }
        hits: { type: integer, format: int64 }
        cover: { type: string, description: 封面 URL (绝对/相对) }
        releaseStamp: { type: integer, format: int64 }
        updateStamp: { type: integer, format: int64 }

    FilmCardPage:
      type: object
      required: [list, page]
      properties:
        list:
          type: array
          items: { $ref: '#/components/schemas/FilmCard' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ---------------- 内容: 热榜筛选维度 ----------------
    HotBoardFilters:
      type: object
      required: [boards, years, areas, languages]
      properties:
        boards:
          type: array
          description: 8 个豆瓣榜单选项 (value=集合名, label=中文榜名; 加榜自动跟上)
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
                description: 集合名, 如 movie_hot_gaia, 作为 /hotboard 的 board 参数
              label:
                type: string
                description: 中文榜名, 如 热门电影
        years:
          type: array
          items: { type: integer }
          description: 在榜影片年份 (降序, 不超过今年+1, 限 12)
        areas:
          type: array
          items: { type: string }
          description: 在榜影片地区 (按量降序, 其它/其他 固定末尾)
        languages:
          type: array
          items: { type: string }
          description: 在榜影片语言 (按量降序, 其它/其他 固定末尾)

    # ---------------- 内容: 详情 ----------------
    PlayEpisode:
      type: object
      required: [episode, link]
      properties:
        episode: { type: string, description: 集数标题 (如 "第01集") }
        link: { type: string, description: 播放地址 / m3u8 链接 }

    PlaySource:
      type: object
      required: [id, name, episodes]
      properties:
        id: { type: string, description: sourceId (站点标识), 与 play 的 source 参数对应 }
        name: { type: string, description: 播放源名 (playFrom) }
        episodes:
          type: array
          items: { $ref: '#/components/schemas/PlayEpisode' }

    FilmDescriptor:
      type: object
      description: 详情描述区, content 落库即清洗 HTML 实体/全角空格 (前端不再正则清)。
      properties:
        cName: { type: string }
        classTag: { type: string }
        director: { type: string }
        actor: { type: string }
        writer: { type: string }
        releaseDate: { type: string }
        area: { type: string }
        language: { type: string }
        year: { type: integer }
        remarks: { type: string }
        state: { type: string }
        content: { type: string }
        dbScore: { type: number, format: float }
        hits: { type: integer, format: int64 }

    FilmDetail:
      type: object
      required: [mid, name, cover, descriptor, sources]
      properties:
        mid: { type: integer, format: int64 }
        cid: { type: integer, format: int64 }
        pid: { type: integer, format: int64 }
        name: { type: string }
        subTitle: { type: string }
        cover: { type: string }
        descriptor: { $ref: '#/components/schemas/FilmDescriptor' }
        sources:
          type: array
          description: 多源聚合 (主站 + 附属站, 按 matchKey 匹配)。
          items: { $ref: '#/components/schemas/PlaySource' }

    FilmDetailResp:
      type: object
      required: [detail, related]
      properties:
        detail: { $ref: '#/components/schemas/FilmDetail' }
        related:
          type: array
          items: { $ref: '#/components/schemas/FilmCard' }

    PlayInfoResp:
      type: object
      description: 播放页, 与详情共用详情读取; source/episode 缺省与越界保护在服务端完成。
      required: [detail, current, currentSource, currentEpisode, related]
      properties:
        detail: { $ref: '#/components/schemas/FilmDetail' }
        current: { $ref: '#/components/schemas/PlayEpisode' }
        currentSource: { type: string, description: "当前播放源 id (与 detail.sources 的 id 对应)" }
        currentEpisode: { type: integer, description: 当前集索引 (从 0 起) }
        related:
          type: array
          items: { $ref: '#/components/schemas/FilmCard' }

    # ---------------- 内容: 首页聚合 (结构化区块, 前端不再补偿) ----------------
    HomeResp:
      type: object
      description: |
        后端完成 merge/去重/随机, 前端删全部补偿 (banner 回退扫描 / hot 回填 picture /
        Math.random 打乱)。cover 已进宽表。
      required: [banner, rankings, rows, recommend]
      properties:
        banner:
          type: array
          description: 轮播 (后端选定, 非前端扫 content)。
          items: { $ref: '#/components/schemas/FilmCard' }
        rankings:
          type: array
          description: 本月热门榜 / 排行区块。
          items:
            type: object
            required: [title, items]
            properties:
              title: { type: string }
              items:
                type: array
                items: { $ref: '#/components/schemas/FilmCard' }
        rows:
          type: array
          description: 分类行 (每个一级分类一行卡片)。
          items:
            type: object
            required: [nav, items]
            properties:
              nav: { $ref: '#/components/schemas/Category' }
              items:
                type: array
                items: { $ref: '#/components/schemas/FilmCard' }
        recommend:
          type: array
          description: 猜你喜欢 (后端随机/去重, 前端直接渲染)。
          items: { $ref: '#/components/schemas/FilmCard' }

    # ---------------- 内容: 分类首页各榜 ----------------
    ClassifyResp:
      type: object
      required: [title, news, top, recent]
      properties:
        title: { $ref: '#/components/schemas/Category' }
        news:
          type: array
          description: 最新上线 (year desc, pub_date desc)
          items: { $ref: '#/components/schemas/FilmCard' }
        top:
          type: array
          description: 排行 (hot_score 降序, 豆瓣榜单热度)
          items: { $ref: '#/components/schemas/FilmCard' }
        recent:
          type: array
          description: 最近更新 (update_stamp desc)
          items: { $ref: '#/components/schemas/FilmCard' }
        score:
          type: array
          description: 高分榜 (db_score 降序, 排除解说; scoredCount=0 时为空)
          items: { $ref: '#/components/schemas/FilmCard' }
        scoredCount:
          type: integer
          format: int64
          description: 该分类有豆瓣评分的影片总数 (0 = 前端隐藏高分榜入口)

    # ---------------- 内容: tag 筛选选项 (查询期 GROUP BY) ----------------
    FilterOption:
      type: object
      required: [name, value]
      properties:
        name: { type: string, description: 展示名 }
        value: { type: string, description: 提交值 (空串表示"全部") }
    FiltersResp:
      type: object
      description: |
        维度选项从 movie_search GROUP BY 实时聚合 (根治采集双写计数虚高)。
        '其它' 语义在筛选端点用 NOT IN/NOT LIKE 保留。
      required: [titles, tags, sortList]
      properties:
        titles:
          type: object
          description: "维度键 → 展示标题 (固定 7 维度 category/plot/area/language/year/...)"
          additionalProperties: { type: string }
        tags:
          type: object
          description: 维度键 → 选项列表
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/FilterOption' }
        sortList:
          type: array
          items: { type: string }
          description: 可选排序 (new|hits|update|score...)

    # ---------------- 配置: 站点 ----------------
    SiteConfig:
      type: object
      properties:
        siteName: { type: string }
        domain: { type: string }
        logo: { type: string }
        keyword: { type: string }
        description: { type: string, description: 改名 describe→description }
        state: { type: integer, description: 1 正常 / 0 维护中 }
        hint: { type: string, description: 维护提示 }
        tmdbKeyMasked: { type: string, description: TMDB 凭据掩码(如 0c06…676b), 未配置为空串; 明文永不外泄 }
        tmdbKeySet: { type: boolean, description: 是否已配置 TMDB 凭据 }
      description: TMDB key 与整组 SMTP 列均经 json:"-" 硬隔离, 任何响应不携带; TMDB 走 /manage/tmdb-key, 邮件走 /manage/mail/config(掩码 DTO)
    TMDBKeyUpdate:
      type: object
      required: [key]
      properties:
        key: { type: string, description: v3 API Key(32 位十六进制)或 v4 Read Access Token(JWT); 保存前服务端验真 }
    SiteConfigUpdate:
      type: object
      properties:
        siteName: { type: string }
        domain: { type: string }
        logo: { type: string }
        keyword: { type: string }
        description: { type: string }
        state: { type: integer, enum: [0, 1] }
        hint: { type: string }

    # ---------------- 配置: APK 版本 ----------------
    AppVersion:
      type: object
      required: [versionCode, versionName, apkUrl, channel]
      properties:
        versionCode: { type: integer }
        versionName: { type: string }
        apkUrl: { type: string }
        changelog: { type: string }
        force: { type: boolean, description: 是否强制升级 }
        channel: { type: integer, enum: [0, 1], description: 0 stable / 1 beta }

    # ---------------- 认证 / 用户 ----------------
    LoginReq:
      type: object
      required: [account, password]
      properties:
        account: { type: string, description: 用户名或邮箱 }
        password: { type: string, format: password }
    LoginResp:
      type: object
      required: [userName, token, expires, role]
      properties:
        userName: { type: string }
        nickName: { type: string }
        token: { type: string }
        expires: { type: integer, format: int64, description: 过期时间戳 (秒) }
        role: { type: integer, enum: [0, 1], description: 0 普通用户 / 1 管理员 }
    PasswordChangeReq:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 6 }
    RegisterConfigResp:
      type: object
      required: [mode, smtpReady]
      properties:
        mode: { type: string, enum: [off, open, apply], description: off 仅后台建号 / open 自由注册 / apply 申请审核 }
        smtpReady: { type: boolean, description: 邮件通道可用(未配置时 open/apply 实际不可用) }
    RegisterCodeReq:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        purpose: { type: string, enum: [register, reset], default: register, description: reset 为找回密码预留(P3) }
    RegisterReq:
      type: object
      required: [userName, password, email, code]
      properties:
        userName: { type: string, maxLength: 32 }
        password: { type: string, format: password, minLength: 6, maxLength: 64 }
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$', description: 6 位数字验证码, 5 分钟有效 }
    RegisterApplyReq:
      type: object
      description: apply 模式申请体; 刻意无 password(密码激活时才设, 见设计 §9.2)
      required: [userName, email, code]
      properties:
        userName: { type: string, maxLength: 32 }
        email: { type: string, format: email }
        reason: { type: string, maxLength: 500, description: 自述/邀请人, 管理员审核参考 }
        code: { type: string, pattern: '^\d{6}$' }
    ApplyResendReq:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ActivateReq:
      type: object
      required: [token, userName, password]
      properties:
        token: { type: string, description: 激活邮件里的一次性 token, 7 天有效 }
        userName:
          type: string
          maxLength: 32
          description: 用户名(窗口期被占用时可与申请时不同, 前端回表单改名重试)
        password: { type: string, format: password, minLength: 6, maxLength: 64 }
    ResetLinkReq:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPwdReq:
      type: object
      required: [token, password]
      properties:
        token: { type: string, description: 重置邮件里的一次性 token, 30 分钟有效 }
        password: { type: string, format: password, minLength: 6, maxLength: 64 }
    ApplyStatusResp:
      type: object
      required: [status, canResend]
      properties:
        status: { type: string, enum: [pending, approved, rejected, none] }
        reason: { type: string, description: 驳回理由(rejected 时) }
        canResend: { type: boolean, description: approved 且未激活 → 可重发激活邮件 }
    RegisterApplyRow:
      type: object
      description: 后台审核列表行(不含密码; 申请表根本不存)
      required: [id, userName, email, reason, sourceIp, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userName: { type: string }
        email: { type: string }
        reason: { type: string }
        sourceIp: { type: string, description: 申请来源 IP, 识别同源批量申请 }
        status: { type: integer, enum: [0, 1, 2] }
        rejectReason: { type: string }
        reviewedBy: { type: integer, format: int64 }
        reviewedAt: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    SmtpPreset:
      type: object
      required: [id, name, host, port, secure, note]
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        secure: { type: string, enum: [ssl, starttls, none] }
        note: { type: string, description: 后台展示的注意事项(如 QQ 邮箱须用授权码) }
    RuntimeSettings:
      type: object
      description: 运行参数(存 site_config; 都是"下次生效"的项)
      required: [authTokenTtlHours, maxDeviceLogin, spiderMaxGoroutine, spiderMasterMaxWorkers, spiderSlaveMaxWorkers]
      properties:
        authTokenTtlHours: { type: integer, minimum: 1, maximum: 8760, description: 登录态有效期(小时); 只影响之后新签发的 token }
        maxDeviceLogin: { type: integer, minimum: 1, maximum: 50, description: 单账号同时在线设备数; 下次登录时按新值裁掉最旧设备 }
        spiderMaxGoroutine: { type: integer, minimum: 1, maximum: 256, description: 采集并发总上限; 实际并发 = min(本值, 主站/从站硬上限, 页数) }
        spiderMasterMaxWorkers: { type: integer, minimum: 1, maximum: 256, description: 主站采集并发硬上限(默认 12); 过高易批量 InnoDB 死锁 }
        spiderSlaveMaxWorkers: { type: integer, minimum: 1, maximum: 256, description: 从站采集并发硬上限(默认 8); 过高易触发源站限流/403 }
    LoginSession:
      type: object
      description: 一条在线登录会话(当前生效的 token)
      required: [id, userId, userName, ip, ua, loginAt, lastSeen]
      properties:
        id: { type: string, description: 会话 id(sha256 前 16 字节 hex); 踢人接口用它 }
        userId: { type: integer, format: int64 }
        userName: { type: string }
        ip: { type: string, description: 登录来源 IP }
        ua: { type: string, description: 登录时 User-Agent }
        loginAt: { type: integer, format: int64, description: 登录时间(unix 秒) }
        lastSeen: { type: integer, format: int64, description: 最近活跃(unix 秒; 请求节流 60s) }
    MailConfigResp:
      type: object
      description: 凭据只回掩码+是否已配置, 永不回明文(与 TMDB key 同范式)
      required: [registerMode, smtpEnabled, smtpHost, smtpPort, smtpSecure, smtpUser, smtpFromName, mailDailyQuota, smtpPassSet, presets]
      properties:
        registerMode: { type: string, enum: [off, open, apply] }
        smtpEnabled: { type: integer, enum: [0, 1] }
        smtpHost: { type: string }
        smtpPort: { type: integer }
        smtpSecure: { type: string, enum: [ssl, starttls, none] }
        smtpUser: { type: string }
        smtpFromName: { type: string }
        mailDailyQuota: { type: integer, minimum: 1, maximum: 1000, description: 全局出站邮件日配额(码/激活/驳回/重置/测试统一计数, 默认 50) }
        smtpPassMasked: { type: string, description: 已配置时的掩码(前4…后4); 未配置空串 }
        smtpPassSet: { type: boolean }
        presets: { type: array, items: { $ref: '#/components/schemas/SmtpPreset' } }
    MailConfigUpdate:
      type: object
      properties:
        registerMode: { type: string, enum: [off, open, apply] }
        smtpEnabled: { type: integer, enum: [0, 1] }
        smtpHost: { type: string }
        smtpPort: { type: integer, minimum: 1, maximum: 65535 }
        smtpSecure: { type: string, enum: [ssl, starttls, none] }
        smtpUser: { type: string }
        smtpPass: { type: string, description: 空串=不修改已存值 }
        smtpFromName: { type: string }
        mailDailyQuota: { type: integer, minimum: 1, maximum: 1000, description: 全局出站邮件日配额; 省略或 0 = 不修改 }
    MailTestReq:
      allOf:
        - $ref: '#/components/schemas/MailConfigUpdate'
        - type: object
          required: [to]
          properties:
            to: { type: string, format: email, description: 测试收件邮箱 }
    UserInfo:
      type: object
      description: 脱敏 (无 password/salt)。
      required: [id, userName, role]
      properties:
        id: { type: integer, format: int64 }
        userName: { type: string }
        nickName: { type: string }
        email: { type: string }
        avatar: { type: string }
        gender: { type: integer }
        status: { type: integer }
        role: { type: integer, enum: [0, 1] }
    UserCreateReq:
      type: object
      required: [userName, password, role]
      properties:
        userName: { type: string, minLength: 4, maxLength: 20, pattern: '^[A-Za-z0-9_]{4,20}$' }
        password: { type: string, format: password, minLength: 8 }
        email: { type: string, format: email }
        nickName: { type: string }
        role: { type: integer, enum: [0, 1] }

    # ---------------- 用户: 历史 / 收藏 ----------------
    HistoryItem:
      type: object
      required: [mid, name]
      properties:
        id: { type: integer, format: int64, description: 记录 ID }
        mid: { type: integer, format: int64 }
        name: { type: string }
        cover: { type: string }
        cName: { type: string }
        episode: { type: string, description: 集数标题 }
        episodeIndex: { type: integer, description: 集索引 }
        sourceId: { type: string }
        progress: { type: number, format: float, description: 播放进度 (秒) }
        duration: { type: number, format: float, description: 总时长 (秒) }
        updatedAt: { type: integer, format: int64 }
    HistoryUpsertReq:
      type: object
      required: [mid]
      properties:
        mid: { type: integer, format: int64 }
        name: { type: string }
        cover: { type: string }
        cName: { type: string }
        episode: { type: string }
        episodeIndex: { type: integer }
        sourceId: { type: string }
        progress: { type: number, format: float }
        duration: { type: number, format: float }
    FavoriteItem:
      type: object
      required: [mid, name]
      properties:
        id: { type: integer, format: int64 }
        mid: { type: integer, format: int64 }
        name: { type: string }
        cover: { type: string }
        cName: { type: string }
        remarks: { type: string }
        createdAt: { type: integer, format: int64 }
    FavoriteAddReq:
      type: object
      required: [mid]
      properties:
        mid: { type: integer, format: int64 }
        name: { type: string }
        cover: { type: string }
        cName: { type: string }
        remarks: { type: string }
    FavoriteCheckResp:
      type: object
      required: [favorited]
      properties:
        favorited: { type: boolean }

    # ---------------- 采集源 ----------------
    CollectSource:
      type: object
      required: [id, name, uri, grade]
      properties:
        id: { type: string, description: 采集源 ID (GenerateSalt) }
        name: { type: string }
        uri: { type: string, format: uri }
        siteUrl: { type: string, description: 站点网址(可选, 后台展示/跳转用) }
        resultModel: { type: integer, enum: [0, 1], description: 0 json / 1 xml }
        grade: { type: integer, enum: [0, 1], description: 0 主站 / 1 附属站 }
        syncPictures: { type: boolean, description: 附属站禁止图片同步 }
        collectType: { type: integer }
        gradeScore: { type: integer }
        intervalMs: { type: integer, description: 采集限速间隔 (ms) }
        state: { type: integer, enum: [0, 1], description: 0 停用 / 1 启用 }
    CollectSourceUpsert:
      type: object
      required: [name, uri, resultModel, grade]
      properties:
        name: { type: string }
        uri: { type: string, format: uri }
        siteUrl: { type: string, description: 站点网址(可选) }
        resultModel: { type: integer, enum: [0, 1] }
        grade: { type: integer, enum: [0, 1] }
        syncPictures: { type: boolean }
        collectType: { type: integer }
        intervalMs: { type: integer }
        state: { type: integer, enum: [0, 1] }
    CollectTestResp:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string }
        sampleCount: { type: integer, description: 测试拉取到的样本数 }

    # ---------------- 定时任务 ----------------
    CronTask:
      type: object
      required: [id, sourceIds, spec, model, state]
      properties:
        id: { type: integer, format: int64 }
        sourceIds:
          type: array
          items: { type: string }
          description: 指定采集源 (model=1 时生效)
        spec: { type: string, description: cron 表达式 (含秒, 6 段) }
        model: { type: integer, enum: [0, 1], description: 0 全部启用站 / 1 指定 ids }
        state: { type: integer, enum: [0, 1] }
        remark: { type: string }
        entryId: { type: integer, description: robfig/cron EntryID 回写 }
        lastRunAt: { type: integer, format: int64 }
    CronTaskUpsert:
      type: object
      required: [spec, model]
      properties:
        sourceIds:
          type: array
          items: { type: string }
        spec: { type: string }
        model: { type: integer, enum: [0, 1] }
        state: { type: integer, enum: [0, 1] }
        remark: { type: string }

    # ---------------- 采集任务 (job) ----------------
    SpiderJobStartReq:
      type: object
      required: [sourceId]
      properties:
        sourceId: { type: string }
        duration: { type: integer, description: '增量时长 (小时); -1 或省略表示全量' }
    SpiderJob:
      type: object
      required: [sourceId, state, totalPages, donePages, failedPages, elapsedMs]
      properties:
        sourceId: { type: string }
        state: { type: string, enum: [running, paused, done, canceled, failed] }
        totalPages: { type: integer }
        donePages: { type: integer }
        failedPages: { type: integer }
        elapsedMs: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
    SpiderResetReq:
      type: object
      description: 清库重采 (取代 GET /spider/zero?accessKey=Re0)。需 admin JWT + 二次确认 token。
      required: [confirm]
      properties:
        confirm: { type: string, description: 二次确认 token (前端弹窗输入, 服务端校验), 防误触/预取/CSRF。 }
    SpiderCategoryCoverReq:
      type: object
      description: 分类覆盖 (取代 GET /spider/class/cover)。
      properties:
        sourceId: { type: string }

    # ---------------- 影片管理 ----------------
    FilmUpsertReq:
      type: object
      required: [name, pid, cid]
      properties:
        name: { type: string }
        enName: { type: string }
        subTitle: { type: string }
        initial: { type: string }
        pid: { type: integer, format: int64 }
        cid: { type: integer, format: int64 }
        cover: { type: string }
        area: { type: string }
        language: { type: string }
        year: { type: integer }
        director: { type: string }
        actor: { type: string }
        writer: { type: string }
        classTag: { type: string }
        content: { type: string }
        remarks: { type: string }
        state: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/PlaySource' }

    # ---------------- 文件库 ----------------
    FileItem:
      type: object
      required: [id, link]
      properties:
        id: { type: integer, format: int64 }
        link: { type: string, description: 访问 URL }
        objectKey: { type: string, description: 对象存储 key (终态) }
        relevanceId: { type: integer, format: int64 }
        type: { type: integer }
        fileType: { type: string }
        createdAt: { type: integer, format: int64 }
    FileUploadResp:
      type: object
      description: 删旧站裸字符串 URL, 返回结构化对象。
      required: [id, link]
      properties:
        id: { type: integer, format: int64 }
        link: { type: string }
        objectKey: { type: string }

    # ---------------- 埋点 ----------------
    TelemetryEvent:
      type: object
      required: [type, ts]
      properties:
        type: { type: string, description: 'pv|error|action|perf|api' }
        ts: { type: integer, format: int64, description: 客户端时间戳 (ms) }
        category: { type: string }
        action: { type: string }
        label: { type: string }
        value: { type: number }
        path: { type: string }
        sessionId: { type: string }
        platform: { type: string }
        appVersion: { type: string }
        extra: { type: string, description: JSON 字符串 (stack/diag 等) }
    TelemetryBatchReq:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/TelemetryEvent' }
    TelemetryOverview:
      type: object
      properties:
        pv: { type: integer, format: int64 }
        uv: { type: integer, format: int64 }
        uniqueUsers: { type: integer, format: int64 }
        errorCount: { type: integer, format: int64 }
        apiCount: { type: integer, format: int64 }
        avgApiMs: { type: number, format: float }
    TelemetryIssue:
      type: object
      properties:
        key: { type: string, description: sha1(category|path|label) }
        category: { type: string }
        path: { type: string }
        label: { type: string }
        count: { type: integer, format: int64 }
        status: { type: string, enum: [unresolved, resolved, reopened, expired] }
        commitId: { type: string }
        firstSeen: { type: integer, format: int64 }
        lastSeen: { type: integer, format: int64 }
    TelemetryResolveReq:
      type: object
      required: [key]
      properties:
        key: { type: string }
        commitId: { type: string }
    TopPath:
      type: object
      properties:
        path: { type: string }
        count: { type: integer, format: int64 }
    ApiPerf:
      type: object
      properties:
        path: { type: string }
        count: { type: integer, format: int64 }
        p50: { type: number, format: float }
        p95: { type: number, format: float }
        p99: { type: number, format: float }

    # ---------------- 仪表盘 ----------------
    DashboardStat:
      type: object
      properties:
        filmCount: { type: integer, format: int64 }
        collectCount: { type: integer, format: int64 }
        cronCount: { type: integer, format: int64 }

    # ---------------- m3u8 ----------------
    M3u8ProxyReq:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: 上游 m3u8 地址 (服务端 SSRF 校验) }
        filterAds: { type: boolean, default: true }

# ============================================================================
# 端点定义
# ============================================================================
paths:

  # ==================== 公开内容 (GET 全部可边缘缓存) ====================
  /home:
    get:
      tags: [content]
      summary: 首页区块化聚合
      operationId: getHome
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeResp' }
        '304': { $ref: '#/components/responses/NotModified' }
        '500': { $ref: '#/components/responses/ServerError' }

  /categories:
    get:
      tags: [content]
      summary: 导航分类树 (show 过滤)
      operationId: getCategories
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '304': { $ref: '#/components/responses/NotModified' }
        '500': { $ref: '#/components/responses/ServerError' }

  /categories/{pid}/filters:
    get:
      tags: [content]
      summary: 分类筛选维度选项 (MySQL GROUP BY 实时聚合)
      operationId: getCategoryFilters
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiltersResp' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotboard:
    get:
      tags: [content]
      summary: 热榜 (8 榜并集或单榜筛选; 枪版影片动态降级)
      description: |
        - `board` 空 → 全部榜并集 (默认按热度, 枪版片动态减一个步长、多榜命中回血);
        - `board` 指定 → 该榜完整成员 (默认按榜位次, 枪版片有效位次后移 1);
        - 其余维度 (pid/year/area/language) 与 /films 同口径;
        - 单榜视图下卡片 hotBoard/hotRank 覆写为"该榜"的位次 (全榜视图为代表榜)。
      operationId: listHotBoard
      parameters:
        - name: board
          in: query
          schema: { type: string }
          description: 豆瓣集合名 (见 /hotboard/filters.boards.value); 空 = 全部榜并集
        - name: pid
          in: query
          schema: { type: integer, format: int64 }
        - name: area
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema: { type: string, enum: [rank, hot, score, latest] }
          description: rank=榜位(仅 board 指定时有效, 否则回落 hot) / hot=热度 / score=评分 / latest=最新上线
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilmCardPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /hotboard/filters:
    get:
      tags: [content]
      summary: 热榜筛选维度 (8 榜固定 + 年份/地区/语言由在榜影片聚合)
      operationId: getHotBoardFilters
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotBoardFilters' }
        '304': { $ref: '#/components/responses/NotModified' }

  /films:
    get:
      tags: [content]
      summary: 影片列表 (关键字搜索 / 分类三榜 / 多维筛选 三态合一)
      description: |
        - `keyword` 存在 → 关键字搜索 (FULLTEXT ngram), 空结果返回 200 + 空数组。
        - `pid` + `sort` (new|hits|update) → 分类三榜单榜模式 (亦可用 /films?pid 列表)。
        - `pid` + `category/plot/area/language/year` → 多维筛选 ('其它' 语义保留)。
        互斥优先级: keyword > 多维筛选 > 单榜。
      operationId: listFilms
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: pid
          in: query
          schema: { type: integer, format: int64 }
        - name: category
          in: query
          description: 二级分类 cid (筛选)
          schema: { type: integer, format: int64 }
        - name: plot
          in: query
          schema: { type: string }
        - name: area
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema: { type: string, enum: [hot, score, latest, update_stamp, recent] }
          description: >-
            排序键: hot=热度优先(hot_score 降序) / score=评分优先(db_score 降序) /
            latest=最新上线(year+pub_date) / update_stamp=最近更新 / recent 同 update_stamp。
            旧值 hits/db_score/release_stamp 仍兼容(等价 hot/score/latest); 未识别回退 update_stamp。
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK (空结果亦 200 + 空 list)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilmCardPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /films/classify:
    get:
      tags: [content]
      summary: 分类首页三榜聚合 (news/top/recent 一次返回)
      operationId: getClassify
      parameters:
        - name: pid
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassifyResp' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /films/{mid}:
    get:
      tags: [content]
      summary: 影片详情 + 多源 (mid 直查, 无 cid 跳)
      operationId: getFilmDetail
      parameters:
        - name: mid
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilmDetailResp' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /films/{mid}/play:
    get:
      tags: [content]
      summary: 播放页 (默认源/默认集/越界保护)
      operationId: getPlayInfo
      parameters:
        - name: mid
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: source
          in: query
          description: 播放源 id, 缺省取第一个源
          schema: { type: string }
        - name: episode
          in: query
          description: 集索引 (从 0 起), 越界回落到 0
          schema: { type: integer, minimum: 0 }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayInfoResp' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /films/{mid}/related:
    get:
      tags: [content]
      summary: 相关推荐
      operationId: getRelated
      parameters:
        - name: mid
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FilmCard' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /films/{mid}/danmu/source:
    get:
      tags: [content]
      summary: 弹幕来源候选（豆瓣 vendors 解析，仅返回平台候选，不暴露 db_id）
      operationId: getDanmuSource
      parameters:
        - name: mid
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string, enum: [tencent, iqiyi, youku, bilibili] }
                        resourceId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /danmu/bilibili:
    get:
      tags: [content]
      summary: B站弹幕代理（整集弹幕，公开接口需限流）
      operationId: getDanmuBilibili
      parameters:
        - name: seasonId
          in: query
          required: true
          schema: { type: string }
        - name: episode
          in: query
          required: false
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        time: { type: integer, format: int64, description: 出现时间(毫秒) }
                        color: { type: integer, description: RGB888 }
                        mode: { type: integer, description: '1 滚动 / 4 底部 / 5 顶部' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /config/site:
    get:
      tags: [content]
      summary: 站点配置 (公开读)
      operationId: getSiteConfig
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfig' }
        '304': { $ref: '#/components/responses/NotModified' }

  /app/version/latest:
    get:
      tags: [content]
      summary: APK 灰度协商 (按 Authorization 解 token 取白名单)
      operationId: getLatestVersion
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: channel
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        '200':
          description: OK (配置缺失兜底 v1.0)
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppVersion' }

  /m3u8/proxy:
    get:
      tags: [m3u8]
      summary: m3u8 代理过滤并生成签名媒体转发地址
      operationId: m3u8Proxy
      parameters:
        - name: src
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: filterAds
          in: query
          schema: { type: integer, enum: [0, 1], default: 1 }
        - name: proxyMedia
          in: query
          description: 设为 1 时将分片、初始化段和密钥改写为签名流转发地址
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        '200':
          description: 过滤并重写后的 m3u8 文本
          headers:
            Cache-Control:
              description: 'public, max-age=120'
              schema: { type: string }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/ServerError' }

  /m3u8/stream:
    get:
      tags: [m3u8]
      summary: 转发 m3u8 manifest 生成的签名媒体地址
      operationId: m3u8Stream
      parameters:
        - name: src
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: exp
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: sig
          in: query
          required: true
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: 完整媒体资源
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Range 媒体响应
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/ServerError' }

  /telemetry/events:
    post:
      tags: [telemetry]
      summary: 埋点批量上报 (公开高频, per-IP 令牌桶, 独立通道)
      operationId: telemetryBatch
      security:
        - {}
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryBatchReq' }
      responses:
        '204':
          description: 已接收 (无内容)
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ==================== 认证 / 用户 (no-store) ====================
  /auth/login:
    post:
      tags: [auth]
      summary: 登录 (唯一登录端点, 删 /login 与 /user/login 重复)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginReq' }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出 (仅清当前设备 token)
      operationId: logout
      security: [{ BearerAuth: [] }]
      responses:
        '204':
          description: 已登出
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/register-config:
    get:
      tags: [auth]
      summary: 注册配置 (登录页据此显隐注册入口; mode 如实返回, smtpReady=false 时 open/apply 实际不可用)
      operationId: getRegisterConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterConfigResp' }

  /auth/register/code:
    post:
      tags: [auth]
      summary: 发送邮箱验证码 (register_mode=off 时拒绝; 同邮箱 1 分钟 1 封 + 日 5 封 + 全局日配额默认 50)
      operationId: sendRegisterCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCodeReq' }
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema: { type: object, properties: { sent: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register:
    post:
      tags: [auth]
      summary: open 模式自注册 (校验验证码 → 落号 → 直接返回登录态; apply 模式不走本端点)
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterReq' }
      responses:
        '200':
          description: 注册成功, 载荷同登录
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register/apply:
    post:
      tags: [auth]
      summary: apply 模式提交注册申请 (不收密码; 同邮箱已有在途申请返回 apply_pending)
      operationId: registerApply
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterApplyReq' }
      responses:
        '200':
          description: 已受理, 等待审核
          content:
            application/json:
              schema: { type: object, properties: { applied: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/apply/status:
    get:
      tags: [auth]
      summary: 查询注册申请进度 (输邮箱; pending / approved(可重发) / rejected+理由 / none)
      operationId: applyStatus
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyStatusResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/apply/resend:
    post:
      tags: [auth]
      summary: 重发激活邮件 (approved 但链接丢了/过期; 作废旧 token, 新链接 7 天有效)
      operationId: applyResend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyResendReq' }
      responses:
        '200':
          description: 已重发
          content:
            application/json:
              schema: { type: object, properties: { resent: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/activate:
    post:
      tags: [auth]
      summary: 激活账号 (一次性 token → 设密码建号 → 自动登录; 用户名窗口期被占可改名重试, token 仍有效)
      operationId: activate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateReq' }
      responses:
        '200':
          description: 激活成功, 载荷同登录
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset-link:
    post:
      tags: [auth]
      summary: 忘记密码 — 发一次性重置链接邮件 (30 分钟有效; 防账号枚举, 邮箱是否存在响应一致)
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetLinkReq' }
      responses:
        '200':
          description: 已受理 (无论邮箱是否存在均返回 sent, 不发信时静默)
          content:
            application/json:
              schema: { type: object, properties: { sent: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      tags: [auth]
      summary: 用重置链接设新密码 (一次性 token; 成功后该用户全部设备退出登录)
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPwdReq' }
      responses:
        '200':
          description: 已重置 (旧 JWT 全部失效, 需重新登录)
          content:
            application/json:
              schema: { type: object, properties: { reset: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me:
    get:
      tags: [me]
      summary: 当前用户信息 (脱敏)
      operationId: getMe
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          headers:
            New-Token: { $ref: '#/components/headers/NewToken' }
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/password:
    patch:
      tags: [me]
      summary: 修改密码 (不强制下线)
      operationId: changePassword
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeReq' }
      responses:
        '204':
          description: 已修改
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me/histories:
    get:
      tags: [me]
      summary: 观看历史列表 (updated_at desc 分页)
      operationId: listHistories
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema:
                type: object
                required: [list, page]
                properties:
                  list:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryItem' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [me]
      summary: 上报/更新观看历史 (按 user_id+mid 唯一 upsert)
      operationId: upsertHistory
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HistoryUpsertReq' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [me]
      summary: 删除单条历史 (按 mid; user_id 防越权)
      operationId: deleteHistory
      security: [{ BearerAuth: [] }]
      parameters:
        - name: mid
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: 已删除
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/histories/clear:
    delete:
      tags: [me]
      summary: 清空全部历史
      operationId: clearHistories
      security: [{ BearerAuth: [] }]
      responses:
        '204':
          description: 已清空
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/favorites:
    get:
      tags: [me]
      summary: 收藏列表 (created_at desc 分页)
      operationId: listFavorites
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [list, page]
                properties:
                  list:
                    type: array
                    items: { $ref: '#/components/schemas/FavoriteItem' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [me]
      summary: 添加收藏 (OnConflict DoNothing 幂等)
      operationId: addFavorite
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteAddReq' }
      responses:
        '201':
          description: 已收藏 (或已存在, 幂等)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoriteItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [me]
      summary: 取消收藏 (按 mid)
      operationId: removeFavorite
      security: [{ BearerAuth: [] }]
      parameters:
        - name: mid
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: 已取消
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/favorites/{mid}:
    get:
      tags: [me]
      summary: 检查是否已收藏
      operationId: checkFavorite
      security: [{ BearerAuth: [] }]
      parameters:
        - name: mid
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoriteCheckResp' }
