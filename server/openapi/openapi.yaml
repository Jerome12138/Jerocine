        '404': { $ref: '#/components/responses/NotFound' }

  /manage/spider/reset:
    post:
      tags: [manage-spider]
      summary: 清库重采 (POST + admin JWT + 二次确认 token, 删 GET+硬编码 Re0)
      operationId: manageSpiderReset
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpiderResetReq' }
      responses:
        '202':
          description: 已受理 (影子表 reindex 在线切换, 无查询空窗)
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /manage/spider/category-cover:
    post:
      tags: [manage-spider]
      summary: 分类覆盖 (POST, 取代 GET /class/cover)
      operationId: manageSpiderCategoryCover
      security: [{ BearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpiderCategoryCoverReq' }
      responses:
        '202':
          description: 已受理
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manage/films:
    get:
      tags: [manage-film]
      summary: 后台影片检索 (统一分页, 删 params.paging 嵌套)
      operationId: manageSearchFilms
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: pid, in: query, schema: { type: integer, format: int64 } }
        - { name: cid, in: query, schema: { type: integer, format: int64 } }
        - { name: plot, in: query, schema: { type: string } }
        - { name: area, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: remarks, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilmCardPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [manage-film]
      summary: 手动补录影片 (时间戳作 mid 避免与采集冲突)
      operationId: manageCreateFilm
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilmUpsertReq' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilmDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /manage/films/{mid}:
    get:
      tags: [manage-film]
      summary: 后台影片详情 (复用公开详情读取)
      operationId: manageGetFilm
      security: [{ BearerAuth: [] }]
      parameters: [{ name: mid, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilmDetailResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /manage/categories:
    get:
      tags: [manage-film]
      summary: 分类树 (含 show=false, 行级)
      operationId: manageListCategories
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [manage-film]
      summary: 新增分类 (行级)
      operationId: manageCreateCategory
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pid]
              properties:
                name: { type: string }
                pid: { type: integer, format: int64 }
                show: { type: boolean }
                sort: { type: integer }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manage/categories/{id}:
    put:
      tags: [manage-film]
      summary: 更新分类 (name/show/sort 行级)
      operationId: manageUpdateCategory
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                show: { type: boolean }
                sort: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [manage-film]
      summary: 删除分类 (取代 GET /class/del)
      operationId: manageDeleteCategory
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '204':
          description: 已删除
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /manage/files:
    get:
      tags: [manage-file]
      summary: 文件库 (id desc 分页, 默认 size=39)
      operationId: manageListFiles
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [list, page]
                properties:
                  list:
                    type: array
                    items: { $ref: '#/components/schemas/FileItem' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [manage-file]
      summary: 上传图片 (扩展名+DetectContentType 双判, 服务端重命名, 10MB, nosniff)
      operationId: manageUploadFile
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                relevanceId: { type: integer, format: int64 }
                type: { type: integer }
      responses:
        '201':
          description: 已上传 (返回结构化对象, 非裸字符串)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileUploadResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /manage/files/{id}:
    delete:
      tags: [manage-file]
      summary: 删除文件 (双重校验, 连本地/对象一起删; 取代 GET /del)
      operationId: manageDeleteFile
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '204':
          description: 已删除
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /manage/app-versions:
    get:
      tags: [manage-version]
      summary: APK 版本列表
      operationId: manageListAppVersions
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: channel, in: query, schema: { type: integer, enum: [0, 1] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [manage-version]
      summary: 新增版本配置 (入库)
      operationId: manageCreateAppVersion
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, versionCode, versionName, apkUrl]
              properties:
                channel: { type: integer, enum: [0, 1] }
                versionCode: { type: integer }
                versionName: { type: string }
                apkUrl: { type: string }
                changelog: { type: string }
                force: { type: boolean }
                whitelist:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /manage/app-versions/{id}:
    delete:
      tags: [manage-version]
      summary: 删除版本配置
      operationId: manageDeleteAppVersion
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '204':
          description: 已删除
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /manage/app-versions/apk:
    post:
      tags: [manage-version]
      summary: 上传 APK (versionName 防路径穿越, 大小/类型限制)
      operationId: manageUploadApk
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, channel, versionName]
              properties:
                file: { type: string, format: binary }
                channel: { type: integer, enum: [0, 1] }
                versionName: { type: string }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema:
                type: object
                properties:
                  apkUrl: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /manage/telemetry/overview:
    get:
      tags: [manage-telemetry]
      summary: 埋点概览 (按 server_ts 窗口避时钟漂移)
      operationId: manageTelemetryOverview
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: hours, in: query, schema: { type: integer, default: 24 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manage/telemetry/events:
    get:
      tags: [manage-telemetry]
      summary: 事件/问题列表 (状态机 unresolved/resolved/reopened/expired)
      operationId: manageTelemetryEvents
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [unresolved, resolved, reopened, expired] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [list, page]
                properties:
                  list:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryIssue' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manage/telemetry/top-paths:
    get:
      tags: [manage-telemetry]
      summary: 页面热点 TopN
      operationId: manageTelemetryTopPaths
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: hours, in: query, schema: { type: integer, default: 24 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TopPath' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manage/telemetry/api-perf:
    get:
      tags: [manage-telemetry]
      summary: API 性能 P50/P95/P99 (应用层近似, 限 1000 条)
      operationId: manageTelemetryApiPerf
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: hours, in: query, schema: { type: integer, default: 24 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiPerf' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manage/telemetry/issues/{key}/resolve:
    post:
      tags: [manage-telemetry]
      summary: 标记问题已解决 (关联 commitId)
      operationId: manageTelemetryResolve
      security: [{ BearerAuth: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                commitId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryIssue' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /manage/telemetry/issues/{key}/unresolve:
    post:
      tags: [manage-telemetry]
      summary: 撤销已解决标记
      operationId: manageTelemetryUnresolve
      security: [{ BearerAuth: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryIssue' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

# ============================================================================
# 健康检查 (无 /api/v1 前缀, 由 nginx 旁路探针直连后端 /healthz)
# 注: 这两个端点不在 /api/v1 servers 基址下, 此处仅作契约记录。
# ============================================================================
  /healthz:
    servers: [{ url: '/' }]
    get:
      tags: [health]
      summary: readiness (ping redis+mysql, 任一失败 503, 2s 超时)
      operationId: healthz
      security: []
      responses:
        '200': { description: 就绪 }
        '503': { description: 依赖不可用 }
  /livez:
    servers: [{ url: '/' }]
    get:
      tags: [health]
      summary: liveness (恒 200)
      operationId: livez
      security: []
      responses:
        '200': { description: 存活 }
