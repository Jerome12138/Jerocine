# Jerocine Redis 配置（裸机部署, install.sh 渲染占位符后落位到 /etc/redis/redis-jerocine.conf）
#
# 与 docker-compose.yml redis.command 逐项对应:
#   requirepass / appendonly yes / appendfsync everysec / save 900 1 /
#   maxmemory @REDIS_MAXMEMORY@ / maxmemory-policy volatile-lru
# 通过 systemd drop-in 覆盖 redis-server 服务的 ExecStart 使用本文件
# （不动发行版默认 /etc/redis/redis.conf, 卸载即还原）。
# DB0 = 应用缓存(可淘汰), DB1 = 采集协调态(带 TTL, 禁手动 FLUSHDB)。

bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
pidfile /run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16

# ---- 持久化(compose 同款) ----
dir /var/lib/redis
dbfilename dump.rdb
save 900 1
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ---- 内存(新架构下 Redis 是可重建缓存, 读路径全部回源 MySQL) ----
maxmemory @REDIS_MAXMEMORY@
maxmemory-policy volatile-lru

# ---- 认证 ----
requirepass @REDIS_PASSWORD@

slowlog-log-slower-than 10000
slowlog-max-len 128
