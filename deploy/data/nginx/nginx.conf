worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip(基础镜像无 brotli 模块; 如需 brotli 换编译版镜像再加指令)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml text/css text/plain
               text/xml image/svg+xml application/wasm application/vnd.apple.mpegurl;

    # 后端上游(keepalive 复用连接)
    upstream film_api {
        server film:3601;
        keepalive 32;
    }

    # API 边缘缓存(尊重后端 ETag / Cache-Control: s-maxage)
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=512m inactive=60m use_temp_path=off;

    # 带 Authorization 的请求不走共享缓存(防串用户数据)
    map $http_authorization $api_no_cache {
        default 0;
        "~.+"   1;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 影片图片 / APK: 长缓存(终态走 CDN)
        location /api/upload/ {
            proxy_pass http://film_api;
            proxy_set_header Host $host;
            proxy_cache api_cache;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # HLS 分片/密钥流式转发: Range 响应不可进入通用 API 缓存，也不能整段缓冲后再下发。
        location = /api/v1/m3u8/stream {
            proxy_pass http://film_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # API 反代: 保留 /api 前缀(后端挂 /api/v1), 尊重后端 ETag, 永不返回空白
        location /api/ {
            proxy_pass http://film_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $api_no_cache;
            proxy_no_cache $api_no_cache;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # 前端静态资源: 内容哈希文件名 → 一年不可变
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html 不缓存(配合 SPA 滚动部署)
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # APK 静态目录(自升级安装包)
        location /apk/ {
            add_header Cache-Control "public, max-age=3600";
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
