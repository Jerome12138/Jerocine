worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip(基础镜像无 brotli 模块; 如需 brotli 换编译版镜像再加指令)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml text/css text/plain
               text/xml image/svg+xml application/wasm application/vnd.apple.mpegurl;

    # 后端上游(keepalive 复用连接)
    upstream jerocine_server {
        server server:3601;
        keepalive 32;
    }

    # API 边缘缓存(尊重后端 ETag / Cache-Control: s-maxage)
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=512m inactive=60m use_temp_path=off;

    # 带 Authorization 的请求不走共享缓存(防串用户数据)
    map $http_authorization $api_no_cache {
        default 0;
        "~.+"   1;
    }

    # 缓存键必须包含 Origin: 后端只对带 Origin 的请求回 CORS 头, 而 nginx proxy_cache
    # 不支持按 Vary 分桶 —— 不分键时, 无 Origin 的探测/回源请求会把"无 ACAO 头"的响应
    # 缓存下来再发给跨域浏览器, 造成 CORS 报错(2026-10-28 web.jerocine.art 上线实测)。
    proxy_cache_key "$scheme$proxy_host$request_uri$http_origin";

    # ── 80 端口: 统一 301 到 HTTPS(2026-11-05 起映射宿主机 80) ──
    # 此前 80 只在容器内给 healthcheck 用、不映射宿主, 公网仅 443。现宿主机 80 已开放
    # (其他运维用途让位), 明文入口一律跳到 https://<同 host><同 path>。
    # ⚠️ healthcheck 必须走 /healthz 而不是 /: 镜像内 wget 会跟随 301 到
    # https://127.0.0.1/, 证书 CN 不匹配直接失败 → 容器永远 unhealthy。
    server {
        listen 80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ── ACME webroot 校验 ──
        # 服务器上 acme.sh 的 jerocine.art 条目是 webroot 模式(Le_Webroot=deploy/data/html,
        # 即本容器的 /usr/share/nginx/html)，续期时把 token 写在该目录下，由 Let's Encrypt
        # 从 http://<域名>/.well-known/acme-challenge/<token> 取回。
        # ⚠️ 这段**不返回 301**：LE 会跟随重定向，到 https 后会被站点域的 SPA 回退(/)吃成
        # index.html，校验必失败(2026-11-05 开 80 时发现)。优先级由 `^~` 最长前缀匹配保证
        # (胜过 location / 的 301)，与书写顺序无关——勿改成 regex location 靠顺序兜底。
        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type text/plain;
            access_log off;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── API 专用域: api.jerocine.art ──
    # 后端独立域名(前端生产构建 VITE_API_BASE 指向本域, 2026-10-28 起)。只反代后端,
    # 不服务站点静态; 非 /api 路径一律 404。榜单长超时/
    # 图片长缓存)与站点域同语义 —— 播放器/壳若切到本域调用, 行为不变。
    server {
        # 只监听 443: 明文入口由上方 default_server 统一 301(避免同一域名两条入口并存)
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        server_name api.jerocine.art;

        add_header X-Robots-Tag "noindex, nofollow" always;

        # 影片图片/APK: 由 nginx 直接从 filestore 卷静态托管(2026-11-09 起, 不再穿透后端)。
        # 卷由 docker-compose 以 :ro 挂到 /var/www/filestore(与 server 同一 named volume)。
        location /filestore/ {
            alias /var/www/filestore/;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # 旧前缀兼容(2026-11-09 前缀迁移前的存量 URL): 同卷直服, 过渡期后整体删除。
        location /api/upload/ {
            alias /var/www/filestore/;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # 榜单手动刷新: 服务端 1-2 分钟, 读/发超时放宽(2026-10-23 事故教训)。
        location = /api/v1/manage/hot/refresh {
            proxy_pass http://jerocine_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 通用 API 反代: 保留 /api 前缀, 边缘缓存 + Authorization 不缓存(与站点域同语义)。
        location /api/ {
            proxy_pass http://jerocine_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $api_no_cache;
            proxy_no_cache $api_no_cache;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # 非 /api 路径: 纯后端域, 不服务站点内容。
        location / {
            return 404;
        }
    }

    # ── 站点域(旧 API 接口保留兼容): jerocine.art / www / web ──
    server {
        # 只监听 443: 明文 80 由上方 default_server 统一 301。
        # 证书由 deploy/certs 挂载(read-only)。
        listen 443 ssl default_server;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # 兼容保留: 旧域 API 接口继续反代同一后端(与 api.jerocine.art 同 upstream,
        # 等效于代理到新域且少一跳自引用 TLS)。web.jerocine.art 原先靠 _ 兜底匹配,
        # 拆分后必须显式列出, 否则落到 default_server 之外的未定义行为。
        server_name jerocine.art www.jerocine.art web.jerocine.art;
        root /usr/share/nginx/html;
        index index.html;

        # 全站禁爬: 该站为个人自用(无版权内容聚合), 必须避开搜索引擎收录。
        # X-Robots-Tag 兜底所有漏网页面(注意 add_header 的 location 不继承语义:
        # 自带 add_header 的 location 需各自补一条, 目前只有 = /index.html ——
        # SPA try_files 内部重定向后也会重新匹配到它)。
        add_header X-Robots-Tag "noindex, nofollow" always;

        # robots.txt: 精确匹配优先于 SPA 回退(否则 /robots.txt 会返回 index.html)。
        # 一小时缓存即可, 改禁爬策略时不用等太久。
        location = /robots.txt {
            default_type text/plain;
            add_header Cache-Control "public, max-age=3600";
            return 200 'User-agent: *
Disallow: /
';
        }

        # 影片图片 / APK: 由 nginx 直接从 filestore 卷静态托管(2026-11-09 起, 不再穿透后端; 终态走 CDN)。
        location /filestore/ {
            alias /var/www/filestore/;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # 旧前缀兼容(2026-11-09 前缀迁移前的存量 URL): 同卷直服, 过渡期后整体删除。
        location /api/upload/ {
            alias /var/www/filestore/;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # 榜单手动刷新: 服务端实测 1-2 分钟, 通用 60s 读超时会把它腰斩(客户端 504,
        # 后端 ctx canceled 零落库 —— 2026-10-23 线上事故)。单独放宽读/发超时;
        # POST + 管理端鉴权, 无缓存语义, 显式关缓存。
        location = /api/v1/manage/hot/refresh {
            proxy_pass http://jerocine_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # API 反代: 保留 /api 前缀(后端挂 /api/v1), 尊重后端 ETag, 永不返回空白
        location /api/ {
            proxy_pass http://jerocine_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $api_no_cache;
            proxy_no_cache $api_no_cache;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # 前端静态资源: 内容哈希文件名 → 一年不可变
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html 不缓存(配合 SPA 滚动部署); noindex 防搜索引擎收录整站入口
        # (该 location 自带 add_header, 不继承 server 级 X-Robots-Tag, 需单独补)
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        # Service Worker 与 Workbox 运行时: 必须 no-cache —— SW 的更新通道就是"取 sw.js 比字节",
        # 一旦被缓存, 新版本永远发不下去(SW 会一直跑旧 manifest, 方案 §4.2/R1)。
        # 两者都在 dist 根(不走 assetsDir), URL 稳定在 /sw.js; workbox 文件名带 hash 但同样不该长缓存。
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location ~ ^/workbox-[^/]*\.js$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # sourcemap 双保险: 同步脚本已把 *.map 排除在挂载目录之外(方案 §5.2),
        # 这里再拒一次, 防手滑 cp 导致源码公开。范围限静态目录, 不碰 /api/(上传文件名可能以 .map 结尾)。
        location ~* ^/(assets|apk)/.*\.map$ {
            return 404;
        }

        # APK 静态目录(自升级安装包)
        location /apk/ {
            add_header Cache-Control "public, max-age=3600";
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── 私有附加站点的加载入口(private 目录, 不入公开仓) ──
    # 与 jerocine 站点本身无关的自建服务(远程浏览器 browser.*、dsh.* 等)的 server 块
    # 全部放在宿主机挂载的 /etc/nginx/conf.d/private/ 下, 由本行统一 include。
    #
    # 为什么独立成文件: 那些服务由私有仓 JerocineHarness 维护, 与公开仓发布节奏无关;
    # 写进本文件会让"每次前端/后端发布重建 nginx 镜像"覆盖掉它们(2026-11-05 之前正是
    # 这个状态: browser 段靠手工 docker cp 进容器, 一重建就丢)。
    #
    # 约定:
    #   - 通配符 include 在目录为空/不存在时**不报错**, 所以公开仓可以零依赖地保留本行;
    #   - 该目录由 docker-compose 以 :ro 挂载(宿主 deploy/data/nginx/private → 容器),
    #     公开仓 .gitignore 已排除, 私有配置只在 JerocineHarness/deploy-config/nginx/ 里;
    #   - private 内的 server 块**不要**再声明 listen 80(80 已被上面的 301 入口占用)。
    include /etc/nginx/conf.d/private/*.conf;
}
