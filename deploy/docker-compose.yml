# Jerocine docker-compose (重构后终态栈)
#
# 用法:
#   1. cp .env.example .env, 填生产值
#   2. cd deploy && docker compose up -d --build
#
# 与旧栈的根本差异:
#   - 新增一次性 migrate 服务: golang-migrate 跑版本化 DDL(替代 AutoMigrate); server 依赖其 completed。
#   - MySQL 是唯一权威真相; Redis 退回纯旁路缓存 + 协调态, 读路径全部 miss 回源 MySQL。
#   - 因此 Redis 可安全开 maxmemory 512mb + volatile-lru(所有缓存/协调键均带 TTL, 淘汰可重建,
#     彻底解开旧栈"开 eviction 即首页空白"的死结 —— 见 commit 6305b91 复盘)。
#   - 后端入口为 ./cmd/server, 路由挂 /api/v1; nginx 保留 /api 前缀反代。
#
# ⚠ 集成验证(不碰线上)用隔离起栈:
#   docker compose -p jerocine-new --env-file .env.validate up -d --build mysql redis migrate server
#   (.env.validate 用不同端口/库名/卷名; 验证完 docker compose -p jerocine-new down -v)
#
# 项目名: 默认 jerocine; 已有旧栈(项目名 film, 数据卷 film_* 前缀)迁移部署时
# 在 .env 里设 COMPOSE_PROJECT_NAME=film 以延续原数据卷与容器, 否则会另起一套空卷。
#
# 相对挂载统一写成 ${JEROCINE_DEPLOY_ROOT:-.}/... : 未设该变量时(树内执行, 现状行为)解析到
# 本文件所在目录(deploy/); 由 deploy.sh 自引导设为 deploy/ 绝对路径时(包内工具链模式,
# compose 文件在 deploy/runtime/ 下), 挂载仍解析到同一个 deploy/ 下的 data/ secrets/ apk/ certs。
# 新增相对挂载时必须沿用该写法, 否则 runtime 模式下会挂到 deploy/runtime/ 下的空目录。
#
# nginx 构建(context/dockerfile)同样可用环境变量切换: 树内 = web/Dockerfile(上下文=仓库根,
# 模式2 服务器自构建); JEROCINE_NGINX_CONTEXT/JEROCINE_NGINX_DOCKERFILE 由 deploy.sh 在
# 包内工具链模式下导出 = deploy/runtime/ + Dockerfile.nginx(随产物包 tooling/ 上送的薄配方)。
name: ${COMPOSE_PROJECT_NAME:-jerocine}

services:
  migrate:
    image: migrate/migrate:v4.17.1
    restart: "no"
    volumes:
      # 迁移文件由 server-deploy 从产物包同步到 data/migrations(与二进制同包同版),
      # 不再挂 git 工作树 —— 服务器树落后/超前都不影响发版与迁移的配套关系。
      # ${JEROCINE_DEPLOY_ROOT:-.} 见文件头: 包内工具链模式下 compose 在 runtime/ 下执行,
      # 靠它把挂载根指回 deploy/。
      - ${JEROCINE_DEPLOY_ROOT:-.}/data/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=mysql://${MYSQL_USER:-jerocine}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-jerocine}?multiStatements=true"
      - "up"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jerocine-network
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  server:
    container_name: jerocine_server
    # 镜像只由 server-deploy 按产物包构建(Dockerfile.runtime, --no-build) —— 这里刻意没有
    # build 段: 编译不上生产机(内存/CPU 争抢 + 13GB build cache 教训)。应急自行构建见部署指南。
    image: jerocine-server:latest
    restart: unless-stopped
    # 优雅停机宽限: SIGTERM 后 server 先收尾 HTTP 再等采集协程(内部预算 30s),
    # 40s 给足余量, 超时才 SIGKILL —— 部署因此无需手动暂停采集。
    stop_grace_period: 40s
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "3601"
      MYSQL_DSN: "${MYSQL_USER:-jerocine}:${MYSQL_PASSWORD}@(mysql:3306)/${MYSQL_DATABASE:-jerocine}?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB_CACHE: "0"
      REDIS_DB_COORD: "1"
      JWT_PRIVATE_KEY_FILE: "${JWT_PRIVATE_KEY_FILE:-/etc/jerocine/secrets/jwt_private.pem}"
      JWT_PUBLIC_KEY_FILE: "${JWT_PUBLIC_KEY_FILE:-/etc/jerocine/secrets/jwt_public.pem}"
      JWT_ISSUER: "Jerocine"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      SPIDER_RESET_TOKEN: "${SPIDER_RESET_TOKEN}"
      BLOB_DRIVER: "local"
      BLOB_LOCAL_DIR: "/opt/server/static/upload"
      BLOB_BASE_URL: "/api/upload/"
      # TMDB 横图回填: API Key 在后台「系统设置 → TMDB」维护(key 唯一权威, 无 env);
      # 这里只有"基本不会改"的语言与反代地址。
      TMDB_LANG: "${TMDB_LANG:-zh-CN}"
      TMDB_API_BASE: "${TMDB_API_BASE:-}"
      TMDB_IMAGE_BASE: "${TMDB_IMAGE_BASE:-}"
      # 弹幕数据服务(danmu-service): 容器网络内服务名; 本地联调用环境变量指向 127.0.0.1:3611。
      DANMU_SERVICE_URL: "http://danmu:3611"
      GIN_MODE: release
    volumes:
      - uploads:/opt/server/static/upload
      - ${JEROCINE_DEPLOY_ROOT:-.}/secrets:/etc/jerocine/secrets:ro
    networks:
      - jerocine-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/server/main", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  danmu:
    container_name: jerocine_danmu
    # 镜像只由 danmu-deploy 按产物包构建(Dockerfile.danmu, --no-build) —— 与 server 同哲学:
    # 依赖(node_modules --production + 上游快照)在本机裁剪好, 编译不上生产机; 这里刻意没有 build 段。
    image: jerocine-danmu:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    networks:
      - jerocine-network
    # 仅容器网络内可达: 不暴露端口, 由 Go 网关经 DANMU_SERVICE_URL(http://danmu:3611)访问。
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    container_name: jerocine_nginx
    build:
      # 默认(树内): 仓库根的 web/Dockerfile —— `./deploy.sh nginx` 树上运维重建用;
      # deploy.sh 在包内工具链模式下导出 JEROCINE_NGINX_CONTEXT/JEROCINE_NGINX_DOCKERFILE
      # 切成随包上送的薄配方(见 deploy/Dockerfile.nginx 头注)。
      context: ${JEROCINE_NGINX_CONTEXT:-..}
      dockerfile: ${JEROCINE_NGINX_DOCKERFILE:-web/Dockerfile}
    image: jerocine-nginx:latest
    restart: unless-stopped
    ports:
      # TLS 直接由本容器终结(单机单站, 不再套外层反代); 宿主 80 让给其他服务, 公网仅暴露 443
      - "443:443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 前端静态产物: 宿主机挂载(替代镜像内 COPY dist) —— 这是"保留 3 版 / 整版回滚"的前提,
      # 镜像重建不再清空线上目录。内容由 web-deploy 同步(先写目录, 最后才 reload)。
      - ${JEROCINE_DEPLOY_ROOT:-.}/data/html:/usr/share/nginx/html
      - ${JEROCINE_DEPLOY_ROOT:-.}/apk:/usr/share/nginx/html/apk:ro
      - ${JEROCINE_DEPLOY_ROOT:-.}/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx/api
    networks:
      - jerocine-network
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  mysql:
    container_name: jerocine_mysql
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-jerocine}"
      MYSQL_USER: "${MYSQL_USER:-jerocine}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jerocine-network
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
      - --lower-case-table-names=1
      - --ngram-token-size=2
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    container_name: jerocine_redis
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --save
      - "900 1"
      # 新架构下 Redis 是可重建缓存(读路径全部回源 MySQL), 故可安全淘汰:
      - --maxmemory
      - "${REDIS_MAXMEMORY:-512mb}"
      - --maxmemory-policy
      - "volatile-lru"
    volumes:
      - redis_data:/data
    networks:
      - jerocine-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  jerocine-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  uploads:
  nginx_cache:
