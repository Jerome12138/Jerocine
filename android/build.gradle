// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // 国内镜像优先（阿里云全量代理 google / central / gradle-plugin 门户）：
        // 冷缓存下直连 google()/mavenCentral() 易超时（实测冷启动要下 ~2.8GB）；
        // 镜像未命中时自动回退到下方官方源。
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.0.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // 国内镜像优先（阿里云全量代理 google / central / gradle-plugin 门户）：
        // 冷缓存下直连 google()/mavenCentral() 易超时（实测冷启动要下 ~2.8GB）；
        // 镜像未命中时自动回退到下方官方源。
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
}

// 本机 JDK 是 17, Capacitor 8.x 默认编译目标 Java 21 -> 强制 override 到 17
// (如果 capacitor-android 源码用了 Java 21 新语法会再次失败, 那时只能装 JDK 21)
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
