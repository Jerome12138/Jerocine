apply plugin: 'com.android.library'

// ============================================================
// 公共播放模块 (WebView 壳 + TV 壳共用一份播放器实现)
//
// 依赖版本唯一来源: 仓库根 scripts/android-versions.properties 的 dep.*。
// 本模块是"播放器技术栈"(media3 / appcompat / okhttp)的唯一声明处, 用 api 暴露给壳层,
// 壳层不再各写一遍版本号。
//
// 定位说明: 与 app/tvshell 同在顶层 android/ 一个工程里(settings.gradle 统一 include)。
// 仍保留向上查找仓库根的写法(而非 ../scripts 固定相对路径), 对目录结构调整更鲁棒。
// ============================================================
def findRepoFile = { String relative ->
    def dir = rootProject.projectDir
    for (int i = 0; i < 5 && dir != null; i++) {
        def candidate = new File(dir, relative)
        if (candidate.exists()) return candidate
        dir = dir.parentFile
    }
    return null
}

def versionsFile = findRepoFile('scripts/android-versions.properties')
if (versionsFile == null) {
    throw new GradleException('找不到 scripts/android-versions.properties, 无法确定依赖版本')
}
def depVersions = new Properties()
versionsFile.withInputStream { depVersions.load(it) }
def ver = { String key ->
    def v = depVersions.getProperty(key)
    if (v == null) throw new GradleException("android-versions.properties 缺少 ${key}")
    return v
}
def media3Version = ver('dep.media3Version')
def okhttpVersion = ver('dep.okhttpVersion')
def appcompatVersion = ver('dep.appcompatVersion')

android {
    namespace 'com.jerocine.player'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'

    // api: 播放器对外暴露 AppCompatActivity 与 PlayerView, 壳层必须拿到这些类型
    api "androidx.appcompat:appcompat:${appcompatVersion}"
    api "androidx.media3:media3-exoplayer:${media3Version}"
    api "androidx.media3:media3-exoplayer-hls:${media3Version}"
    api "androidx.media3:media3-ui:${media3Version}"
    api "androidx.media3:media3-datasource:${media3Version}"
    api "androidx.media3:media3-datasource-okhttp:${media3Version}"
    api "androidx.media3:media3-database:${media3Version}"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"

    // 纯逻辑(URL 策略/画质命名/落点钳位)单测
    testImplementation 'junit:junit:4.13.2'
}

// Android Lint 守卫: 把 NewApi 提为 fatal —— lintVitalRelease(正式包构建自动运行)只拦 fatal 级,
// minSdk 21 无 desugaring 的 API 误用从此在出包时强制挡下
// (2026-10-15 事故: java.util.function/List.sort 在坚果投影 Android 6 上 NoClassDefFoundError)。
// 注意: 改的是 lint 新检查问题的严重级, 不是豁免 —— 现存问题已全部修干净, 新增即断包。
android {
    lint {
        error 'NewApi'
        // media3 的 unstable API opt-in 提示(153 处): 本工程锁定 media3 8.x 版本、有意全量使用
        // 其 unstable API(整个播放层就是这么写的), 该检查是"升级 media3 时要整体评估"的开发提示,
        // 不是 API 兼容性问题 —— 显式豁免, 升级 media3 时再整体过一遍。
        disable 'UnsafeOptInUsageError'
    }
}
