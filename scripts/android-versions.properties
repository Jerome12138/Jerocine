# Jerocine 安卓包版本号 —— 全仓唯一修改点
#
# 谁读这里:
#   web/android/app/build.gradle   -> web.*       (Capacitor 壳应用 art.jerocine.app)
#   tv/app/build.gradle.kts        -> native.*    (原生 TV 客户端 art.jerocine.tv)
#   scripts/build-android.sh       -> 两者, 用于生成 APK 文件名
#
# 构建号(versionCode)统一千位编号: 1000 + 迭代号, 保证四位、且单调递增。
# Android 只认 versionCode 能否变大, 它不能回退 —— 每个正式包都必须拿到一个**新的、更大的**
# 构建号, 否则新包装不到已装旧包的设备上、也可能被分发渠道判成重复版本。
#   ★ 每次正式打包 versionCode 必须 +1（版本名没说可以不动）。这一步现在由脚本自动完成,
#     不要靠人记: build-android.sh 正式构建时会拿 web./native.versionCode 和下面的
#     served.* 水位线比 —— 只要"这一版已经出过正式包"就自动 +1 并回写本文件, 交付后再
#     把新值记进水位线。构建失败不推进水位线, 所以重试仍是同一个号, 不会白烧号。
#   想故意重打同一个构建号（临时给别人重发同一版）: 给脚本加 --keep-version。
# 版本名(versionName)按语义化版本手改（脚本不动）, 与构建号各自独立。
#
# 临时覆盖(不改文件, 单次构建生效), 传给 gradle 或 build-android.sh:
#   -PwebVersionCode=1042 -PwebVersionName=1.1.0
#   -PnativeVersionCode=1002 -PnativeVersionName=1.0.1
#   bash scripts/build-android.sh all -- -PwebVersionCode=1042

web.versionCode=1041
web.versionName=1.0.9

native.versionCode=1001
native.versionName=1.0.0

# ---------------------------------------------------------------------------
# 已发布水位线 —— 由 build-android.sh 自动维护, **不要手改**。
# 含义: 该 kind 已经出过正式包的最大构建号。正式构建时:
#   上面的 versionCode <= 水位线  -> 这一版已经发过包了 -> 脚本自动 +1 并回写上面那行;
#   上面的 versionCode >  水位线  -> 手动改大了 -> 尊重你的值, 脚本不动。
# 交付成功后水位线推进到本次实际构建号; 构建失败不推进(重试不烧号)。
# ---------------------------------------------------------------------------
served.web.versionCode=1041
served.native.versionCode=1001

# 依赖库版本 —— 公共播放模块(player-core)与两壳共用一份, 避免各 build 文件各写一遍.
# 谁读这里:
#   tv/player-core/build.gradle   -> dep.*  (播放器技术栈: 唯一声明处)
#   web/android/app/build.gradle  -> dep.*  (Capacitor 壳额外/兼容依赖)
# 注意: tv/app 的 media3 由 player-core 以 api 传递, 不再重复声明.
dep.media3Version=1.4.1
dep.okhttpVersion=4.12.0
dep.appcompatVersion=1.7.0

